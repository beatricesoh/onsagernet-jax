[tool.poetry]
name = "onsagernet"
version = "0.1.3"
description = ""
authors = ["Qianxiao Li"]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.poetry.dependencies]
python = "^3.12"
pdoc = "^15.0.4"
equinox = "^0.13.0"
optax = "^0.2.5"
tqdm = "^4.67.1"
datasets = "^4.0.0"
scikit-image = "*"
# jax = {extras = ["cuda12"], version = "^0.6.2"}
jax = "^0.6.2"

[tool.poetry.dev-dependencies]
pytest = "^8.4.1"

[tool.poetry.group.examples.dependencies]
scikit-learn = "^1.7.0"
diffrax = "^0.7.0"
jupyter = "^1.1.1"
hydra-core = "^1.3.2"
seaborn = "^0.13.2"
hydra-joblib-launcher = "^1.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
